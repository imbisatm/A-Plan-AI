services:
  - type: web
    name: aplan-ai-tutor
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aplan-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
